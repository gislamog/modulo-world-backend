name: Publish image

# Only on merge to main. Pull requests must not publish: an image tagged
# 'latest' from an unmerged branch is what the server would pull next.
on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  # Not cancelled in flight. A half-pushed manifest is worse than a
  # duplicate build, and merges to main are infrequent.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required to push to GitHub Container Registry with GITHUB_TOKEN.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The runner is x86. QEMU provides the emulation that lets it
      # produce an arm64 image; without it the build fails outright
      # rather than silently producing the wrong architecture.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided by Actions. No secret to configure or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The SHA tag is the one deploys should pin. 'latest' is a
          # convenience that moves, so it cannot identify what is running.
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # The Oracle server is Ampere. An x86 image builds and pushes
          # happily, then fails to start on the server, which is the
          # single easiest thing to get wrong here.
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in Actions, so an unchanged dependency layer is
          # not rebuilt under emulation every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
